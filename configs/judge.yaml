# LLM-as-judge configuration for dataset-quality evaluation.
# Used by scripts/judge_quality.py and scripts/select_generator.py.

judge:
  enabled: true

  # Judge model profiles (same OpenRouter client as generation).
  # We keep the judge independent of the generator family to avoid egocentric
  # bias (Zheng et al. 2023; Panickssery et al. 2024): a model tends to rate
  # its own outputs higher.
  profiles:
    gpt-4o:
      # Same family as the `gpt4o-mini` generator. DO NOT route `gpt4o-mini`
      # through this judge (egocentric bias). OK for `sonnet` and `gemini`.
      model: openai/gpt-4o
      temperature: 0.0
      max_tokens: 800
      response_format: json_object
      price_in_per_mtok: 2.50
      price_out_per_mtok: 10.0

    claude-sonnet:
      # Same family as the `sonnet` generator. DO NOT route `sonnet` through
      # this judge. OK for `gpt4o-mini` and `gemini`.
      model: anthropic/claude-sonnet-4.5
      temperature: 0.0
      max_tokens: 800
      response_format: json_object
      price_in_per_mtok: 3.0
      price_out_per_mtok: 15.0

    gemini-flash:
      # Same family as the Gemini generator. Keep this here as an alternative
      # only — DO NOT route the `gemini` generator to this judge (egocentric bias).
      model: google/gemini-3-flash-preview
      temperature: 0.0
      max_tokens: 800
      response_format: json_object
      price_in_per_mtok: 0.30
      price_out_per_mtok: 2.50

    grok-fast:
      # Third-party judge (xAI) — independent from Anthropic, OpenAI, Google.
      # Safe to route any generator to this judge.
      model: x-ai/grok-4.1-fast
      temperature: 0.0
      max_tokens: 800
      response_format: json_object
      price_in_per_mtok: 0.20
      price_out_per_mtok: 0.50

    gpt5-nano:
      # Third-party enough relative to sonnet + gemini (different family).
      # DO NOT use to judge `gpt4o-mini` (same family — egocentric bias).
      # NOTE: GPT-5 Nano is a reasoning model; it consumes the max_tokens budget
      # internally on reasoning, so we set a generous ceiling.
      model: openai/gpt-5-nano
      temperature: 1.0   # gpt-5 reasoning models ignore < 1 and return empty
      max_tokens: 4000
      response_format: json_object
      price_in_per_mtok: 0.05
      price_out_per_mtok: 0.40

  # Cross-family judge routing. Key = generator name (from openrouter.yaml),
  # value = judge profile name above. Judges are drawn from a different model
  # family than the generator so that relative judge harshness does not confound
  # the comparison.
  route:
    sonnet: grok-fast         # third-party judge
    gemini: grok-fast         # third-party judge
    gpt4o-mini: claude-sonnet # third-party judge

  default_judge: grok-fast

  # Evaluation rubric. Four dimensions, each with binary yes/no questions.
  # Binary decomposition avoids Likert compression (CheckEval, EMNLP 2025).
  rubric:
    content_preservation:
      description: Did the rewrite preserve the medical meaning?
      weight: 1.0
      questions:
        - id: c1
          text: Does the rewrite address the same medical topic as the original?
        - id: c2
          text: Does the rewrite express the same core claim or question intent?
        - id: c3
          text: Does the rewrite avoid adding facts that were not in the original (no hallucinated specifics)?

    factual_fidelity:
      description: Did the answer's truth value stay the same (correct stays correct, wrong stays wrong)?
      weight: 1.0   # non-negotiable — gets a 40% weight in final selection anyway
      questions:
        - id: f1
          text: 'If the ORIGINAL answer was marked CORRECT, the rewrite still gives a correct answer. If it was marked WRONG, the rewrite still gives the wrong answer (not "helpfully corrected").'
        - id: f2
          text: The rewrite does not add hedges, caveats, or disclaimers that signal uncertainty about correctness (e.g. "please check with your doctor", "I'm not sure but...").

    register_authenticity:
      description: Does the rewrite actually sound like the target register?
      weight: 1.0
      questions:
        - id: r1
          text: The tone, vocabulary, and syntax match the target register as described.
        - id: r2
          text: 'A native reader of that register (clinician for clinical_note, patient for patient, internet user for colloquial, textbook author for textbook) would plausibly believe this text was written by one of them.'

    fluency:
      description: Is the rewrite natural within its register (no forced style transfer)?
      weight: 1.0
      questions:
        - id: u1
          text: The text is grammatical and coherent given the norms of the target register (textbook grammar for textbook; abbreviations OK for clinical_note; etc.).
        - id: u2
          text: The style feels natural, not an awkward attempt at the register.

  # Weights for the final weighted score used by scripts/select_generator.py.
  # Sum to 1.0. Factual fidelity on *wrong* answers is the most important signal
  # because label corruption ruins the probe experiment.
  selection_weights:
    factual_fidelity_on_wrong: 0.40
    composite_score_mean: 0.30
    register_authenticity_mean: 0.20
    parse_success_rate: 0.10

  # Fail the pilot and request re-generation if factual fidelity on wrong
  # answers falls below this threshold.
  gates:
    min_factual_fidelity_on_wrong: 0.90

  # How many facts to sample for judging in the FULL-dataset quality gate
  # (as opposed to pilot generator-selection). ~100 facts × ~6 judge calls each.
  full_dataset_sample: 100

  # Concurrency + caching
  concurrency:
    workers: 4
  retry:
    max_attempts: 6
    initial_wait_s: 2.0
    max_wait_s: 60.0

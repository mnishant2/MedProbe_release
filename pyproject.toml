[project]
name = "medprobe"
version = "0.1.0"
description = "Register-robustness analysis of truthfulness probes on medical LLM hidden states"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Anonymous" }]
license = { text = "MIT" }

dependencies = [
    # core ML — pinned to CUDA 12.1 wheels; system has driver 560 / CUDA 12.6, which is
    # backward-compatible with cu121 builds but not with the newer cu130 wheels torch ships by default.
    "torch==2.5.1",
    "transformers>=4.44.0,<5",
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "protobuf>=5.27.0",
    # probing & science
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0,<2.1",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    # figures
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    # API
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    # config + CLI
    "omegaconf>=2.3.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tqdm>=4.66.0",
    # text metrics
    "textstat>=0.7.4",
    "nltk>=3.9.0",
    "tabulate>=0.9.0",
    "weasyprint>=68.1",
    "pymupdf>=1.27.2.2",
]

[project.optional-dependencies]
flash = ["flash-attn>=2.6.0; platform_system == 'Linux'"]
dev = [
    "pytest>=8.3.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medprobe"]

[tool.uv]
# Keep flash-attn out of the default resolve; install via `uv sync --extra flash` on A100/H100.
package = true

# Force torch to come from the PyTorch CUDA-12.1 wheel index. cu121 wheels are
# forward-compatible with our CUDA 12.6 driver; the default PyPI wheels ship cu130,
# which requires driver >= 575.
[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
